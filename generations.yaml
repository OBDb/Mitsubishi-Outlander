generations:
  - name: "First Generation (CU/ZE/ZF)"
    start_year: 2001
    end_year: 2008
    description: "The original Mitsubishi Outlander was introduced as a compact crossover SUV, initially marketed as the Airtrek in Japan before adopting the global Outlander name. The Airtrek was first introduced to the Japanese market on June 20, 2001, as a car-like unibody crossover with available all-wheel drive. Built on the GS platform shared with the Lancer, it offered both front-wheel drive and four-wheel drive configurations. The Outlander nameplate arrived in North America in 2003, replacing the Mitsubishi Montero Sport with modified front grille and headlights that increased overall length. Powertrain options included a 2.0L 4G63 turbo engine (producing 240 PS in Japan, 202 PS in export markets), a 2.0L GDI engine, and a 2.4L four-cylinder engine. Transmission choices included four-speed and five-speed automatic transmissions and five-speed manual. The interior offered seating for five passengers with flexible cargo arrangements. This first generation established the Outlander nameplate as a compact crossover competitor against the Toyota RAV4 and Honda CR-V."

  - name: "Second Generation (CW/ZG/ZH)"
    start_year: 2006
    end_year: 2012
    description: "The second-generation Outlander was launched on October 17, 2005, and featured more distinctive styling with Mitsubishi's 'Jet Fighter' inspired design. Production began in 2006, with North American model years starting in 2007 and running through 2013. Larger than its predecessor, it moved into the mid-size crossover category and introduced an available third-row seat for seven-passenger capability. Built on the Mitsubishi GS platform, it offered improved handling and refinement. Powertrain options included a 2.0L DOHC MIVEC four-cylinder, 2.4L MIVEC four-cylinder, 3.0L V6, and in some markets, diesel engines including VW's 2.0L TDI and PSA's 2.2L DW12 HDi units. An electronically controlled all-wheel drive system called Super All-Wheel Control (S-AWC) was available on higher trims. The second generation introduced the first Outlander PHEV in January 2013 (launched at the 2012 Paris Motor Show), combining a 2.0L gasoline engine with electric motors and lithium-ion battery, with limited initial availability. Interior quality improved significantly with better materials and available features. Facelifts in 2008 and 2010 kept the model current. PSA's Peugeot 4007 and Citroën C-Crosser were badge-engineered versions manufactured by Mitsubishi in Japan."

  - name: "Third Generation (GF/GG/ZJ/ZK/ZL)"
    start_year: 2012
    end_year: 2024
    description: "The third-generation Outlander was unveiled at the 2012 Geneva Motor Show with production beginning in Russia in July 2012, followed by European markets in September 2012. Model years started in 2013 for export markets. This generation featured refined styling with Mitsubishi's 'Dynamic Shield' design language introduced in the 2016 facelift. Built on an updated version of the GS platform, it maintained seven-seat seating in most markets while offering improved noise isolation and ride quality. Powertrain options included 2.0L and 2.4L four-cylinder engines and a 3.0L V6. The Outlander PHEV became significantly more available during this generation, featuring a 2.0L or 2.4L petrol engine with electric motors. Three facelifts occurred: the first in 2014, the second in 2016 (introducing Dynamic Shield styling and CVT8 transmission), and the third in 2019 with updated grille and bumper designs. The battery capacity for the PHEV increased from 12 kWh to 13.8 kWh in 2019, extending electric range to 65 km. Production continued through 2024, representing one of the longest-running generations. The third-generation Outlander, particularly in PHEV form, became the world's best-selling plug-in hybrid, helping establish Mitsubishi's reputation in electrified vehicles."

  - name: "Fourth Generation (GM/GN/ZM)"
    start_year: 2021
    end_year: null
    description: "The fourth-generation Outlander debuted on February 16, 2021, representing the most substantial redesign in the model's history. Developed after Mitsubishi became part of the Renault-Nissan-Mitsubishi Alliance, it was based on the Nissan Rogue/X-Trail (T33) and uses the CMF-CD platform shared within the alliance. Production began in 2021 for 2022 model year introduction. The design features a bold interpretation of the 'Dynamic Shield' front design with complex surface detailing and floating roof effect. Substantially larger than its predecessor, it offers improved passenger space particularly in the standard third row. The primary powertrain is the 2.5L Nissan PR25DD four-cylinder engine producing 181 horsepower, paired with a Jatco CVT8 transmission and available with the updated Super All-Wheel Control (S-AWC) system. The PHEV variant, released in Japan in October 2021 and arriving in North America for the 2023 model year, features the 2.4L 4B12 engine with upgraded electric motors and a larger 20 kWh lithium-ion battery providing 87 km of electric-only range. The interior represents a major leap forward with higher quality materials, a modern design featuring a 9-inch touchscreen infotainment system with wireless Apple CarPlay, 12.3-inch digital instrument cluster, and available head-up display. Safety technology includes forward collision mitigation, lane departure warning, adaptive cruise control, and blind-spot monitoring. Starting in 2026, the Outlander will also be rebadged as the Nissan Rogue PHEV in North America. The fourth-generation Outlander demonstrates the benefits of the Alliance partnership while preserving Mitsubishi's distinctive character and all-weather capability focus."
